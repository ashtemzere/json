name: Auto Scraper Update

on:
  schedule:
    - cron: '0 0 * * *' # هەموو ڕۆژێک لە کاتژمێر 12ی شەو کاردەکات
  workflow_dispatch: # ڕێگەت پێدەدات بە دەستی خۆت کاری پێ بکەیت

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add apps.json
        git commit -m "ئەپدەیتکردنەوەی ئۆتۆماتیکی فایلی apps.json" || echo "هیچ گۆڕانکارییەک نییە بۆ کۆمیت کردن"
        git push
